; Sits between Ark and Postgres. Ark connects here without a password, and
; PgBouncer logs in to Postgres with the password from userlist.txt.
;
; Anything that can reach this port gets into the database, so only let the app
; server reach it (bind it to 127.0.0.1, or use a firewall rule).

[databases]
ark = host=postgres port=5432 dbname=ark user=ark

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Keep in step with DB_MAX_CONNECTIONS in src/app/app.c.
default_pool_size = 20
